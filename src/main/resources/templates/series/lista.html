<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series | Séries</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <main class="container">

        <div class="cabecalho">
            <div>
                <h1>Séries cadastradas</h1>
                <p>Descubra e organize suas séries favoritas.</p>
            </div>

            <a th:href="@{/paginas/series/nova}" class="botao">
                + Nova série
            </a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Plataforma</th>
                    <th>Ano</th>
                    <th>Gênero</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="serie : ${series}">
                    <td th:text="${serie.nome}"></td>
                    <td th:text="${serie.plataforma}"></td>
                    <td th:text="${serie.anoLancamento}"></td>
                    <td th:text="${serie.genero}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(series)}">
                    <td colspan="4">
                        Nenhuma série cadastrada até o momento.
                    </td>
                </tr>
            </tbody>
        </table>

        <nav class="navegacao">
            <a th:href="@{/paginas/jogos}">
                Ver jogos cadastrados
            </a>
        </nav>

    </main>

</body>
</html>
