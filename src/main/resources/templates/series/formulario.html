<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series | Nova série</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <main class="container">

        <h1>Nova série</h1>
        <p>Preencha os dados para adicionar uma série à coleção.</p>

        <form method="post"
              th:action="@{/paginas/series/nova}"
              th:object="${serie}">

            <label for="nome">Nome da série</label>
            <input type="text"
                   id="nome"
                   th:field="*{nome}"
                   placeholder="Ex.: Breaking Bad"
                   required>

            <label for="plataforma">Plataforma</label>
            <input type="text"
                   id="plataforma"
                   th:field="*{plataforma}"
                   placeholder="Ex.: Netflix"
                   required>

            <label for="anoLancamento">Ano de lançamento</label>
            <input type="number"
                   id="anoLancamento"
                   th:field="*{anoLancamento}"
                   placeholder="Ex.: 2008"
                   min="1900"
                   max="2100"
                   required>

            <label for="genero">Gênero</label>
            <input type="text"
                   id="genero"
                   th:field="*{genero}"
                   placeholder="Ex.: Drama"
                   required>

            <div class="acoes">
                <button type="submit" class="botao">
                    Cadastrar série
                </button>

                <a th:href="@{/paginas/series}"
                   class="botao botao-secundario">
                    Cancelar
                </a>
            </div>

        </form>

    </main>

</body>
</html>
